services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-practica4-5
    environment:
      POSTGRES_DB: ${PGDATABASE:-seguros_db}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres123}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${PGUSER:-postgres} -d $${PGDATABASE:-seguros_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
