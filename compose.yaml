services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-practica4-5
    environment:
      POSTGRES_DB: ${PGDATABASE:-seguros_db}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres123}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./SQL/esquema.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
      - ./practica4/migraciones/001-dominios.sql:/docker-entrypoint-initdb.d/02-dominios.sql:ro
      - ./practica5/sql/002-referencias.sql:/docker-entrypoint-initdb.d/03-referencias.sql:ro
      - ./practica4/migraciones/003-permisos.sql:/docker-entrypoint-initdb.d/04-permisos.sql:ro
      - ./practica4/datos/datos_prueba.sql:/docker-entrypoint-initdb.d/05-datos_prueba.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${PGUSER:-postgres} -d $${PGDATABASE:-seguros_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
